      content: >-
        [color=#1b67a5]█▄ █ ▀█▀    [head=3]Central Command Memo[/head]

        █ ▀█     █        Pre-Made Borg[/color]

        ──────────────────────────────────────────

        Attention,


        It is requested that, if possible, the members of the science department aboard this transport complete this borg for use by the Station Artificial Intelligence, as it appears premade borgs with modules installed have mysteriously an unceremoniously disappeared.


        To complete this borg:

        - Screw the borg's unscrewed screws (Using a screwdriver).

        - Place the microreactor, B.O.R.I.S. module, inside.

        - Await the SAI's choice of chassis

        - Insert the thruster module into the borg


        If this borg is to disappear, let it be known that the science department will recieve the following penatlies:

        - A substantial portion of their pay taken to repay the cost of said borg.

        - An increased limit to rations obtained at the Central Command Living Center cafeteria.

        - An inability to attend the pizza party which ends the quarter.
      editingDisabled: True
