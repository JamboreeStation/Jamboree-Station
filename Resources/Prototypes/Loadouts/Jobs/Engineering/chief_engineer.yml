# For mantles
- type: loadoutEffectGroup
  id: MasterCE
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChiefEngineer
      time: 20h

# Goobstation - For Ensembles
- type: loadoutEffectGroup
  id: GrandMasterCE
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChiefEngineer
      time: 360000 # 100 hrs

