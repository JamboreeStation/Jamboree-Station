# Bubblegum.
- type: entity
  name: Bubblegum
  suffix: WARNING!!! QUITE POWERFUL!!!
  parent:
  - BaseSimpleMob
  - MobCombat
  - MobBloodstream
  id: MobBubblegum
  description: Sovereign of the Slaughter Demons, Hand to the Geese, and your destruction!
  components:
  - type: AnnounceOnSpawn
    message: bubblegum-has-risen
    sender: bubblegum-has-risen-sender
    sound:
      path: /Audio/_Goobstation/SlaughterDemon/briefing.ogg
    color: "#ff4a9b"
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - DevilFaction
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.9
        density: 30000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
  - type: Sprite
    sprite: _Jamboree/Mobs/Demons/bubblegum.rsi
    layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: bubblegum
    scale: 1.5,1.5
  - type: NightVision
    color: "#AA4A44"
    activateSound: null
    deactivateSound: null
  - type: Insulated
  - type: NoSlip
  - type: StatusEffects
    allowed:
    - SlowedDown
    - Stutter
    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Pacified
    - RadiationProtection
    - Drowsiness
    - Adrenaline
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bubblegum
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 1
    baseSprintSpeed : 1.5
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepThud
  - type: Speech
    speechVerb: SlaughterDemon
    speechSounds: SlaughterDemon
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: SlaughterDemon
  - type: MobThresholds
    thresholds:
      0: Alive
      10000: Dead
  - type: Stamina
    critThreshold: 100000
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
  - type: MeleeWeapon
    attackRate: 0.8
    altDisarm: false
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Blunt: 30
        Slash: 30
        Piercing: 30
        Structural: 300
    range: 3 # Goob
  - type: Body
    prototype: SlaughterDemon
  - type: DemonicAccent # the accent
  - type: Vocal
    sounds:
      Male: SlaughterDemon
      Female: SlaughterDemon
      Unsexed: SlaughterDemon
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Effects/demon_dies.ogg
  - type: WeakToHoly
    alwaysTakeHoly: true
  - type: ZombieImmune
  - type: Perishable
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Eldritch
    understands:
    - TauCetiBasic
    - Eldritch
  - type: ContentEye
    maxZoom: 1.5,1.5
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Common
    - Command
    - CentCom
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Syndicate
    globalReceive: true
  # Goobstation
  - type: CollectiveMind
    defaultChannel: Binary
    channels:
    - Binary
