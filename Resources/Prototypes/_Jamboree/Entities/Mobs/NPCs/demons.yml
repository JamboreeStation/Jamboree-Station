# Wendigo
- type: entity
  name: wendigo
  parent:
  - BaseSimpleMob
  - MobCombat
  - MobBloodstream
  id: MobWendigo
  description: A mythological servant of the Old Gods. It's eyes track you with insatiable hunger.
  components:
  - type: GhostRole
    allowMovement: true
    makeSentient: true
    name: ghost-role-information-wendigo-name
    description: ghost-role-information-wendigo-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
      - SimpleHostile
  - type: Body # Shitmed
    prototype: Wendigo
  - type: SurgeryTarget # Shitmed
  - type: UserInterface # Shitmed
    interfaces:
      enum.SurgeryUIKey.Key:
        type: SurgeryBui
  - type: Damageable
    damageContainer: BiologicalMetaphysical
    damageModifierSet: Wendigo
  - type: Butcherable
    spawned:
    - id: WendigoSkull
      amount: 1
  - type: Speech
    speechVerb: LargeMob
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: Sprite
    sprite: _Jamboree/Mobs/Demons/wendigo.rsi
    layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: CollectiveMind
    defaultChannel: Shadowmind
    channels:
    - Shadowmind
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: MobPrice
    price: 1000 # Living critters are valuable in space.
  - type: Perishable
  - type: Reflect
    reflectProb: 0.5
    reflects:
      - Energy
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.9
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
  - type: Vocal
    sounds:
      Male: SoundsHarpyMale
      Female: SoundsHarpyFemale
      Unsexed: SoundsHarpyFemale
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
      - HarpyEmotes
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: StatusEffects
    allowed:
    - SlowedDown
    - Stutter
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - RadiationProtection
    - Adrenaline
  - type: MeleeWeapon
    attackRate: 0.8
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Blunt: 45
        Structural: 45
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepThud
  - type: Devourer
    foodPreferenceWhitelist:
      components:
      - HumanoidAppearance
    stomachStorageWhitelist:
      components:
      - MobState
      - Item
    chemical: Ichor
    healRate: 7.5
    whitelist:
      components:
      - MobState
      - Door
      - Item
      tags:
      - Wall
  - type: IntrinsicVoiceModulator
  - type: ActionGrant
    actions:
    - ActionBlinkWendigo
    - ActionChangeIntrinsicVoiceModulator
  - type: NightVision # Goobstation - Nigthvision
    color: "#d10000"
    activateSound: null
    deactivateSound: null
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Eldritch
    understands:
    - TauCetiBasic
    - Eldritch
  - type: NoSlip
  - type: DashAction
    actionProto: ActionDashGeneric

