- type: entity
  id: EnergyReagentDispenserBase
  abstract: true
  parent: SmallConstructibleMachine
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -0.4, 0.25, 0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Battery
    netsync: false
    maxCharge: 1500
    startingCharge: 1500
  - type: ApcPowerReceiverBattery
    idleLoad: 65
    batteryRechargeRate: 30
    batteryRechargeEfficiency: 1.0
  - type: ApcPowerReceiver
    powerLoad: 65
  - type: ExtensionCableReceiver
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      energyBeakerSlot: !type:ContainerSlot
      storagebase: !type:Container
  - type: StaticPrice
    price: 1000
  - type: WiresPanel
  - type: StealTarget
    stealGroup: ChemDispenser
  - type: ActivatableUI
    key: enum.EnergyReagentDispenserUiKey.Key
  - type: UserInterface
    interfaces:
      enum.EnergyReagentDispenserUiKey.Key:
        type: EnergyReagentDispenserBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: EnergyReagentDispenser
    energyBeakerSlot:
      whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
      whitelist:
        components:
        - FitsInDispenser
    reagents: {}


- type: entity
  id: EnergyReagentDispenserPortableBase
  abstract: true
  parent: EnergyReagentDispenserBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -0.4, 0.25, 0.4"
        density: 190
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer


- type: entity
  id: EnergyBoozeDispenser
  parent: EnergyReagentDispenserPortableBase
  name: Energy booze dispenser
  description: A drunk mans best dream. Using the power of bluespace, this dispenser uses station energy to produce alcoholic beverages! Now you can get wasted without leaving the bar to restock! Ever!
  components:
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    state: booze
    drawdepth: SmallObjects
    snapCardinals: false
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: Machine
    board: EnergyBoozeDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  - type: EnergyReagentDispenser
    reagents:
      Ale: 5
      Beer: 5
      CoffeeLiqueur: 5
      Cognac: 5
      Gin: 5
      Mead: 5
      Rum: 5
      Tequila: 5
      Vermouth: 5
      Vodka: 5
      Whiskey: 5
      Wine: 5
  - type: Battery
    netsync: false
    maxCharge: 2500
    startingCharge: 100


