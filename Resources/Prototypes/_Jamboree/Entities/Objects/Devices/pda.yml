# Geneticist PDA. Re-uses the medical-themed PDA visuals as a placeholder until
# dedicated geneticist artwork lands.
- type: entity
  parent: BaseMedicalPDA
  id: GeneticistPDA
  name: geneticist PDA
  description: Smells faintly of mutagen.
  components:
  - type: Pda
    id: GeneticistIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-medical
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#447987"
  - type: Icon
    state: pda-medical
