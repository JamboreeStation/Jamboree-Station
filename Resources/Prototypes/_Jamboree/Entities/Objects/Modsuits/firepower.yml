- type: entity
  parent: [ ClothingModsuitStandard, BaseSecurityContraband ]
  id: ClothingModsuitFirepower
  name: Firepower Mk.6 Armor control unit
  description: The main controller for a Firepower modsuit.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Modsuits/firepower.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealed" ]
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetFirepower
      gloves: ClothingModsuitGauntletsFirepower
      outerClothing: ClothingModsuitChestplateFirepower
      shoes: ClothingModsuitBootsFirepower
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
          - PowerCell
  - type: Storage
    grid:
    - 0,0,1,3
    - 3,0,6,3
    - 8,0,9,3
    maxItemSize: Huge
  - type: ExplosionResistance
    damageCoefficient: 0.1
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
      - state: equipped-BACKPACK-sealed-unshaded
        shader: unshaded
  - type: StealTarget
    stealGroup: Warden
  - type: ClothingGrantTag
#    isActive: True
    tag: FirepowerGauntletsWorn

- type: entity
  parent: [BaseItem, ClothingModsuitGauntletsStandard, BaseSecurityContraband]
  id: ClothingModsuitGauntletsFirepower
  name: Firepower Mk.6 Armor gauntlets
  description: A pair of heavily modified self recharging modsuit gauntlets capable of firing disabling and laser bolts.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Modsuits/firepower.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      map: [ "sealed" ]
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      gloves:
      - state: equipped-HAND-sealed
      gloves-vox:
      - state: equipped-HAND-sealed-vox
  - type: AmmoSelector
    prototypes:
    - BulletDisablerFirepower
    - BulletEnergyGunLaser
  - type: ActivatableUI
    key: enum.AmmoSelectorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AmmoSelectorUiKey.Key:
        type: AmmoSelectorMenuBoundUserInterface
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 100
  - type: ComponentToggler
    components:
    - type: Gun
      fireRate: 2
      useKey: false
      soundGunshot:
        path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
      soundEmpty:
        path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
    - type: Insulated
    - type: MeleeWeapon
      attackRate: 1.5
      canHeavyAttack: false
      damage:
        types:
          Blunt: 7
          Structural: 10 # rip and tear (through railings/small chairs)
      soundHit:
        collection: MetalThud
      angle: 0
      animation: WeaponArcThrust
      range: 1.2
      mustBeEquippedToUse: true
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatterySelfRecharger
    autoRechargeRate: 25
    autoRechargePauseTime: 15

- type: entity
  parent: [ClothingModsuitHelmetStandard, ShowSecurityIcons, BaseSecurityContraband]
  id: ClothingModsuitHelmetFirepower
  name: Firepower Mk.6 Armor helmet
  description: A highly advanced helmet belonging to the Firepower modsuit, it is capable of playing music and posseses a sechud.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Modsuits/firepower.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0.3
      NerveDamage: 0.3
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.8
        Radiation: 0.2
        Caustic: 0.7
  - type: FlashImmunity
  - type: FlashSoundSuppression
    protectionRange: 1
  - type: PointLight
    color: "#ee4B2B"
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      head-vox:
      - state: equipped-HEAD-sealed-vox
      head-vulpkanin:
      - state: equipped-HEAD-sealed
  - type: ActivatableUI
    inHandsOnly: false
    singleUser: true
    requireActiveHand: false
    verbText: verb-instrument-openui
    key: enum.InstrumentUiKey.Key
  - type: SpeechSoundsReplacer
    speechSounds: Lathe
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
  - type: ComponentToggler
    components:
    - type: Instrument
      program: 62
    - type: SwappableInstrument
      instrumentList:
        "Overdriven": {29: 0}
        "Rock": {29: 0}
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.5
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.01
      coolingCoefficient: 0.01
    - type: IdentityBlocker
    - type: IngestionBlocker
      blockSmokeIngestion: True

- type: entity
  parent: [ClothingModsuitChestplateStandard, BaseSecurityContraband]
  id: ClothingModsuitChestplateFirepower
  name: Firepower Mk.6 Armor chestplate
  description: The engineers back home worked their asses off for this one. This isn't your ordinary modsuit.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Modsuits/firepower.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0.3
      NerveDamage: 0.3
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.8
        Radiation: 0.2
        Caustic: 0.7
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
  - type: StaminaResistance
    damageCoefficient: 0.4
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: FireProtection
    reduction: 0.8
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.5
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coolingCoefficient: 0.01
      heatingCoefficient: 0.01

- type: entity
  parent: [ClothingModsuitBootsStandard, BaseSecurityContraband]
  id: ClothingModsuitBootsFirepower
  name: Firepower Mk.6 Armor boots
  description: A state-of-the-art pair of magboots. They will slow you down very little.
  categories: [HideSpawnMenu]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Modsuits/firepower.rsi
    layers:
    - state: boots
    - state: boots-sealed
      map: [ "sealed" ]
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed
      shoes-vox:
      - state: equipped-FEET-sealed-vox
  - type: ItemToggle
  - type: ToggleClothing
    action: ActionToggleMagboots
  - type: ModifyStandingUpTime
    multiplier: 1.5
  - type: Magboots
    enabledPrefix: null
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ClothingGrantComponent
    component:
    - type: Flight
      staminaDrainMultiplier: 0.75
      isAnimated: false
      isLayerAnimated: false
      toggleAction: ActionToggleFlightFirepower
      staminaDrainRate: 5
      flapInterval: 10
      flapSound:
        path: /Audio/_Jamboree/Effects/booster.ogg
