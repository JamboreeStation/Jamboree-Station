# Shirts Start
- type: entity
  parent: ClothingOuterBase
  id: JamboreeClothingOuterSuitShirtIan
  name: ian shirt
  description: An old and worn shirt bearing the image of the station's lovable corgi, Ian. It's rumored that the funds from the sale of this shirt went towards the creation of more Ian's.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Misc/ian_shirt.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/OuterClothing/Misc/ian_shirt.rsi

- type: entity
  parent: ClothingOuterBase
  id: JamboreeClothingOuterSuitShirtNerd
  name: nerd shirt
  description: An old and worn shirt which bears the visage of a purple rodentia once known as the quickest thing around. Nowadays they just speedrun video games.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/OuterClothing/Misc/nerd_shirt.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/OuterClothing/Misc/nerd_shirt.rsi
# Shirt End

