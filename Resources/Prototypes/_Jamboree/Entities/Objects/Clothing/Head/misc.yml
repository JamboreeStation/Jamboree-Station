# Jamboree orignals
- type: entity
  parent: ClothingHeadBase
  id: JamboreeClothingHeadHatGorilla
  name: gorilla head
  description: "Ook ook ook!"
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/Head/Costume/gorilla_h.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/Head/Costume/gorilla_h.rsi
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide

- type: entity
  parent: ClothingHeadBase
  id: JamboreeClothingHeadHatBingle
  name: bingle head
  description: "Unlike the real thing, the inside actually smells nice!"
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/Head/Costume/bingle_hat.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/Head/Costume/bingle_hat.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.16"
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide

