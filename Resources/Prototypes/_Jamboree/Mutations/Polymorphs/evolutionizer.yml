# Polymorph configurations used by the Evolutionizer console.
# Monkeys become Urist McHumans, kobolds become Urist McReptilians.
- type: polymorph
  id: EvolutionizerMonkeyToHuman
  configuration:
    entity: MobHuman
    forced: true
    inventory: Drop
    revertOnCrit: false
    revertOnDeath: false
    transferDamage: true

- type: polymorph
  id: EvolutionizerKoboldToReptilian
  configuration:
    entity: MobReptilian
    forced: true
    inventory: Drop
    revertOnCrit: false
    revertOnDeath: false
    transferDamage: true
