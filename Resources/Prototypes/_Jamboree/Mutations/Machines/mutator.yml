# Reused sprite: generic computer screen "dna" state from Structures/Machines/computers.rsi.
- type: entity
  parent: BaseComputer
  id: ComputerMutator
  name: mutator
  description: A console that links to a medical scanner via multitool and randomly mutates whoever's inside.
  placement:
    mode: SnapgridCenter
  components:
  - type: Mutator
  - type: GeneticMachine
  - type: DeviceLinkSource
    range: 4
    ports:
    - MedicalScannerSender
  - type: Computer
    board: MutatorComputerCircuitboard
  - type: ActivatableUI
    key: enum.MutatorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MutatorUiKey.Key:
        type: MutatorBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: mutator
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c28"
