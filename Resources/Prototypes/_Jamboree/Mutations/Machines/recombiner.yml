# Reused sprite: generic computer screen "dna" state from Structures/Machines/computers.rsi.
- type: entity
  parent: BaseComputer
  id: ComputerRecombiner
  name: recombiner
  description: A console that splices loaded genepacks into a single, balanced genepack injector.
  placement:
    mode: SnapgridCenter
  components:
  - type: Recombiner
  - type: ItemSlots
    slots:
      GenepackSlot1: &recombinerSlot
        name: genepack-slot-name
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Machines/id_insert.ogg
        whitelist:
          components:
          - Genepack
      GenepackSlot2: *recombinerSlot
      GenepackSlot3: *recombinerSlot
      GenepackSlot4: *recombinerSlot
      GenepackSlot5: *recombinerSlot
      GenepackSlot6: *recombinerSlot
      GenepackSlot7: *recombinerSlot
      GenepackSlot8: *recombinerSlot
  - type: Computer
    board: RecombinerComputerCircuitboard
  - type: ActivatableUI
    key: enum.RecombinerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.RecombinerUiKey.Key:
        type: RecombinerBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: recombiner
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c28"
