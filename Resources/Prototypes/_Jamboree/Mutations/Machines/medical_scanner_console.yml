# Reused sprite: generic computer screen "medical" state from Structures/Machines/computers.rsi.
- type: entity
  parent: BaseComputer
  id: ComputerMedicalScannerConsole
  name: medical scanner console
  description: A console that links to a medical scanner via multitool and runs continuous health analyzer readouts on whoever is sealed inside.
  placement:
    mode: SnapgridCenter
  components:
  - type: MedicalScannerConsole
  - type: GeneticMachine
  - type: HealthAnalyzer
    # Console-mounted analyzer doesn't depend on proximity to the patient; the
    # GeneticMachine's link enforces the distance check instead.
    maxScanRange: null
    silent: true
    scanningBeginSound: null
  - type: DeviceLinkSource
    range: 4
    ports:
    - MedicalScannerSender
  - type: Computer
    board: MedicalScannerConsoleCircuitboard
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: scanner
    - map: ["computerLayerKeys"]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c8c"
