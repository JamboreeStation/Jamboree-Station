      // Swaps one word
      def corporate(word) {
          tail = "";
          while (length(word) > 1 && find(".,!?;:", substr(word, length(word))) > 0) {
              tail = substr(word, length(word)) + tail;
              word = substr(word, 1, length(word));
          }
          swap = words[lower(word)];
          if (swap == null) {
              return word + tail;
          }
          if (substr(word, 1, 2) != lower(substr(word, 1, 2))) {
              swap = proper(swap);
          }
          return swap + tail;
      }

      def process_signal(sig) {
          parts = explode(sig.content, " ");
          for (i = 1; i <= parts.len; i += 1) {
              parts[i] = corporate(parts[i]);
          }
          sig.content = implode(parts, " ");
          return sig;
      }
