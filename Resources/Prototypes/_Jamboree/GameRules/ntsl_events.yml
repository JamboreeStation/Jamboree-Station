- type: entity
  parent: BaseGameRule
  id: NtslRogueScript
  components:
  - type: StationEvent
    startAnnouncement: station-event-ntsl-rogue-script-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 5
    duration: 1
    eventType: Neutral
  - type: GameRule
    chaosScore: 30
  - type: NtslScriptRule
    header: |
      /*****************************************************************************
       *   ____   __   __  _   _   ____    ___    ____      _      _____   _____
       *  / ___|  \ \ / / | \ | | |  _ \  |_ _|  / ___|    / \    |_   _| | ____|
       *  \___ \   \ V /  |  \| | | | | |  | |  | |       / _ \     | |   |  _|
       *   ___) |   | |   | |\  | | |_| |  | |  | |___   / ___ \    | |   | |___
       *  |____/    |_|   |_| \_| |____/  |___|  \____| /_/   \_\   |_|   |_____|
       *
       *  SIGNAL INJECTOR PAYLOAD v0.9.3b
       *  (C) CYBERSUN INDUSTRIES - ALL RIGHTS RESERVED
       *  Licensed to: GORLEX MARAUDERS, FIELD OFFICE 7
       *
       *  Do not distribute outside Syndicate channels.
       *  "Every channel is our channel."
       ****************************************************************************/

      // Payload runtime: rare at first.
      payload_start = time();

      def escalate() {
          return prob(clamp(10 + (time() - payload_start) * 0.15, 10, 100));
      }
    scripts:
    - |
      def process_signal(sig) {
          if (escalate()) {
              sig.content = sig.content + " meow";
          }
          return sig;
      }
    - |
      def process_signal(sig) {
          if (escalate()) {
              sig.content = upper(sig.content);
              sig.filters = list(filter_types.robot);
          }
          return sig;
      }
    - |
      def process_signal(sig) {
          if (escalate()) {
              sig.source = reverse(sig.source);
          }
          return sig;
      }
    - |
      def process_signal(sig) {
          if (escalate()) {
              sig.content = sig.content + " HONK!";
              sig.filters = list(filter_types.wacky);
          }
          return sig;
      }
    - |
      def process_signal(sig) {
          if (escalate()) {
              text = sig.content;
              text = replace(text, "a", "4");
              text = replace(text, "e", "3");
              text = replace(text, "i", "1");
              text = replace(text, "o", "0");
              text = replace(text, "s", "5");
              text = replace(text, "t", "7");
              sig.content = text;
          }
          return sig;
      }
    - |
      def process_signal(sig) {
          if (escalate()) {
              words = explode(sig.content, " ");
              noisy = list();
              for (i = 1; i <= words.len; i += 1) {
                  noisy += words[i];
                  if (i < words.len && prob(30)) {
                      noisy += "-kssht-";
                  }
              }
              sig.content = implode(noisy, " ");
          }
          return sig;
      }

# Central Command puts a filter on every telecom server for a while, then gives the old scripts back.
- type: entity
  parent: BaseGameRule
  id: NtslCentcomFilter
  components:
  - type: StationEvent
    startAnnouncement: station-event-ntsl-centcom-filter-start-announcement
    endAnnouncement: station-event-ntsl-centcom-filter-end-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 3
    duration: 600
    maxDuration: 900
    eventType: Neutral
  - type: GameRule
    chaosScore: 20
  - type: NtslScriptRule
    allServers: true
    restore: true
    earlyRemovalAnnouncement: station-event-ntsl-centcom-filter-removed-announcement
    scripts:
    - |
      rude = list("fuck", "shit", "damn", "bitch", "bastard");

      def process_signal(sig) {
          for (i = 1; i <= rude.len; i += 1) {
              sig.content = replace(sig.content, rude[i], "*beep*");
          }
          return sig;
      }
    - |
      def process_signal(sig) {
          if (find(sig.content, "Glory to Nanotrasen") == 0) {
              sig.content = sig.content + " -Glory to Nanotrasen!";
          }
          return sig;
      }
