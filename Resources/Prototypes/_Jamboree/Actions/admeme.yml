- type: entity
  parent: BaseAction
  id: ActionBlinkWendigo
  name: Blink
  description: Return to the Old Gods embrace, and then be ripped from it again.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi # Todo - Unique sprite?
    state: jaunt
  - type: Action
    useDelay: 90 #It's a bit broken if they can just do it all the time, yeah?
    raiseOnUser: true
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _Jamboree/Mobs/Demons/wendigo.rsi # Todo - Change this
      state: alive
  - type: InstantAction
    event: !type:PolymorphSpellEvent
      protoId: Jaunt

- type: entity
  parent: BaseAction
  id: ActionBlinkSlendermime
  name: Blink
  description: Return to the Mimefather's embrace, and then be ripped from it again.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi # Todo - Unique sprite?
    state: jaunt
  - type: Action
    useDelay: 45
    raiseOnUser: true
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _Jamboree/Mobs/Demons/slendermime.rsi # Todo - Change this
      state: alive
  - type: InstantAction
    event: !type:PolymorphSpellEvent
      protoId: Jaunt

- type: entity
  parent: BaseAction
  id: ActionShiftSlendermime
  name: Shift
  description: Disappear.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
  - type: TargetAction
    checkCanAccess: false
    range: 48
  - type: WorldTargetAction
    event: !type:TeleportSpellEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSlendermimeBoo
  name: Haunt
  description: Scare the crew out of boredom!
  components:
  - type: Action
    icon: Interface/Actions/scream.png
    checkCanInteract: false
    startDelay: true
    useDelay: 20
  - type: InstantAction
    event: !type:BooActionEvent
