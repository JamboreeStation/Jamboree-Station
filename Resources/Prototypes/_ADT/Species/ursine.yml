- type: species
  id: Ursine
  name: species-name-ursine
  roundStart: true
  prototype: MobUrsine
  sprites: MobUrsineSprites
  markingLimits: MobUrsineMarkingLimits
  dollPrototype: MobUrsineDummy
  skinColoration: Hues
  maleFirstNames: NamesUrsineFirst
  femaleFirstNames: NamesUrsineFirst
  lastNames: NamesUrsineLast
  naming: FirstLast
  # begin Goobstation: port EE height/width sliders
  minHeight: 1.10
  defaultHeight: 1.4
  maxHeight: 1.3
  minWidth: 1.15
  defaultWidth: 1.3
  maxWidth: 1.35
  # end Goobstation: port EE height/width sliders

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobUrsineSprites
  sprites:
    Eyes: MobHumanoidEyes
    Head: MobUrsineHead
    Face: MobHumanoidAnyMarking
    Underwear: MobHumanoidAnyMarking
    Undershirt: MobHumanoidAnyMarking
    Chest: MobUrsineChest
    Groin: MobUrsineGroin
    HeadTop: MobHumanoidAnyMarking
    LArm: MobUrsineLArm
    RArm: MobUrsineRArm
    LHand: MobUrsineLHand
    RHand: MobUrsineRHand
    LLeg: MobUrsineLLeg
    RLeg: MobUrsineRLeg
    LFoot: MobUrsineLFoot
    RFoot: MobUrsineRFoot
    HeadSide: MobHumanoidAnyMarking # Oni port from DeltaV

- type: markingPoints
  id: MobUrsineMarkingLimits
  points:
    Snout:
      points: 2
      required: true
      defaultMarkings: [ ADTUrsinenose ]
    Head:
      points: 4
      required: false
    Face:
      points: 2
      required: false
    HeadTop:
      points: 2
      required: false
    Chest:
      points: 4
      required: false
    Undershirt:
      points: 1
      required: false
    Underwear:
      points: 1
      required: false
    RightFoot:
      points: 2
      required: false
    LeftFoot:
      points: 2
      required: false
    RightHand:
      points: 2
      required: false
    LeftHand:
      points: 2
      required: false
    Overlay:
      points: 1
      required: false

