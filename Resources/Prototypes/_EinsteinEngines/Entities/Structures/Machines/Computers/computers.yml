- type: entity
  parent: BaseComputerAiAccess
  id: ComputerPsionicsRecords
  # Jamboree: rebranded to Mutant Registry (Mutations system).
  name: mutant registry computer
  description: Used to check mutant registry records. Only the Geneticist can modify them.
  components:
  - type: PsionicsRecordsConsole
  - type: UserInterface
    interfaces:
      enum.PsionicsRecordsConsoleKey.Key:
        type: PsionicsRecordsConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.PsionicsRecordsConsoleKey.Key
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: registry
    - map: ["computerLayerKeys"]
      state: rd_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    # Jamboree: cyan to match the Mutant Registry rebrand.
    color: "#1f8c8c"
  - type: Computer
    board: PsionicsRecordsComputerCircuitboard
  - type: AccessReader
    access:
    - [ Chapel ]
    - [ ResearchDirector ]
    # - type: GuideHelp
    # guides: # TODO: Add a guide for Psionics Registry
