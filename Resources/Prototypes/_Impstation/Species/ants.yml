- type: species
  id: Ant
  name: species-name-ant
  roundStart: false
  prototype: MobAnt
  sprites: MobAntSprites
  defaultSkinTone: "#FFFFFF"
  markingLimits: MobAntMarkingLimits
  dollPrototype: MobAntDummy
  skinColoration: Hues
  maleFirstNames: NamesAntFirst
  femaleFirstNames: NamesAntFirst
  lastNames: NamesAntLast
  sexes:
  - Unsexed
  minAge: 2
  youngAge: 6
  oldAge: 12
  maxAge: 20

- type: speciesBaseSprites
  id: MobAntSprites
  sprites:
    Eyes: MobAntEyes
    Head: MobAntHead
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    Chest: MobAntChest
    Groin: MobAntGroin
    LArm: MobAntLArm
    RArm: MobAntRArm
    LHand: MobAntLHand
    RHand: MobAntRHand
    LLeg: MobAntLLeg
    RLeg: MobAntRLeg
    LFoot: MobAntLFoot
    RFoot: MobAntRFoot

- type: markingPoints
  id: MobAntMarkingLimits
  onlyWhitelisted: true
  points:
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ AntAntennae1 ]
    HeadSide:
      points: 1
      required: false
    Chest:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Arms:
      points: 4
      required: false
    Overlay:
      points: 3
      required: false
    Snout:
      points: 1
      required: false
    Legs:
      points: 2
      required: false

