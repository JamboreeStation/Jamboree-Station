- type: entity
  id: PartAnt
  parent: [BaseItem, BasePart]
  name: "ant body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Visitors/Ants/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Anomalocarid
  - type: Damageable # Shitmed
    damageModifierSet: Anomalocarid
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#3d909c"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: InsectBlood
        Quantity: 10

- type: entity
  id: ChestAnt
  name: "ant torso"
  parent: [PartAnt, BaseChest]
  components:
  - type: Sprite
    state: "chest"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: InsectBlood
        Quantity: 20

