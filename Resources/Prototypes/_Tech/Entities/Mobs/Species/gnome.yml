- type: Tag
  id: SpeciesGnome

- type: entity
  parent: BaseMobSpeciesOrganic
  id: MobBaseGnome
  name: Urist McHands The Gnome
  save: false
  abstract: true
  components:
  # Specials
  - type: DropDualWieldWeapon
  - type: Tinkerer
  # Tags
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - SpeciesGnome
  # Visuals
  - type: Icon
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  # Damage
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Gnome
  - type: Hunger
  - type: Thirst
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 145
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Body
    prototype: Gnome
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatGnome
      amount: 3
  - type: Vocal
    sounds:
      Male: UnisexGnome
      Female: FemaleGnome
      Unsexed: UnisexGnome
  - type: ReplacementAccent
    accent: Gnome
  - type: Speech
    speechSounds: Gnome
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SolCommon
    - Gnomish
    understands:
    - TauCetiBasic
    - SolCommon
    - Gnomish
  - type: HumanoidAppearance
    species: Gnome
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: HumanoidDisplacement
    displacement:
      sizeMaps:
        32:
          sprite: _Tech/Mobs/Species/Gnome/displacement.rsi
          state: dwarfism
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _Tech/Mobs/Species/Gnome/displacement.rsi
          state: dwarfism_hand_left
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _Tech/Mobs/Species/Gnome/displacement.rsi
          state: dwarfism_hand_right
  - type: Inventory
    femaleDisplacements: { }
    displacements:
      jumpsuit:
