- type: entity
  parent: BaseMobSpeciesOrganic
  id: TTMobBaseGnome
  name: Urist McHands The Gnome
  save: false
  abstract: true
  components:
  # Visuals
  - type: Icon
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  # Damage
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Drawbacks
  - type: Hunger
  - type: Thirst
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 240
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Body
    prototype: Gnome
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Vocal
    sounds:
      Male: UnisexGnome
      Female: FemaleGnome
      Unsexed: UnisexGnome
  - type: ReplacementAccent
    accent: Gnome
  - type: Speech
    speechSounds: Bass
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SolCommon
    - Gnomish
    understands:
    - TauCetiBasic
    - SolCommon
    - Gnomish
  - type: HumanoidAppearance
    species: Dwarf
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female

- type: entity
  parent: BaseSpeciesDummy
  id: TTMobDummyGnome
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
