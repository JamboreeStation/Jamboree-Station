- type: entity
  parent: ClothingHeadBase
  id: ClothingBaseHeadHatPointy
  name: pointy hat
  description: A tall pointy hat, the pride of any gnome. There's a tiny pocket in the tip.
  abstract: true
  components:
  - type: Sprite
    sprite: Clothing/Head/Hats/chefhat.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/chefhat.rsi
  - type: Storage
    grid:
    - 0,0,0,0
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

