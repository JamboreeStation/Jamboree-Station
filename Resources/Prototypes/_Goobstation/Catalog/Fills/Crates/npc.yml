- type: entity
  id: CrateNPCGondola
  parent: CrateLivestock
  name: gondola crate
  description: A crate containing a gondola.
  components:
    - type: StorageFill
      contents:
        - id: MobGondola

- type: entity
  id: CrateNPCLootbug
  parent: CrateLivestock
  name: crate of lootbugs
  description: A crate containing three lootbugs.
  components:
  - type: StorageFill
    contents:
      - id: MobLootbug
        amount: 3

- type: entity
  id: CrateNPCXenobioSlime
  parent: CrateLivestock
  name: xenobiology slime crate
  description: A crate containing a singular grey slime for xenobiology related experiments. #changed name and description to be more specific
  components:
  - type: EntityTableContainerFill # Jamboree - Containerfill is the new storagefill.
    containers:
      entity_storage:
        !type:GroupSelector
        children:
          - id: MobSlimeXenobioBabyGrey
            weight: 1
