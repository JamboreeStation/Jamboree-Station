# A basic inheritable template for a gun that is wieldable and has the standard inaccuracy.
- type: entity
  id: BaseGunWieldable
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: RestrictGunshotsByUserTag # Goobstation
    doesntContain:
    - Oni
    - FirepowerGauntletsWorn # Jamboree - firepower modsuit
    messages:
    - generic-cannot-shoot-1 # Jamboree - was oni-cannot-shoot-x
    - generic-cannot-shoot-2
    - generic-cannot-shoot-3
  - type: Gun
    minAngle: 21
    maxAngle: 32
