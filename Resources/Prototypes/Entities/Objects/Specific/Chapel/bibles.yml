#START SET SELECTION
- type: entity
  id: ChaplainUndeterminedBible
  name: bluespace scripture beacon
  description: Though I walk through the valley of the shadow of death I will fear no evil, for you are with me.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    # Impstation Adds start
    - ScrollSet
    - TabletSet
    - GreybibleSet
    - KojikiSet
    - TaoSet
    - DiscordSet
    - ArcaneSet
    - UnitologySet
    - ExtremeSet
    - BibbleSet
    - ThreesSet 
    # Impstation Adds end
    - ClockworkSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  name: The Holy Bible
  description: Sever any tie, but the ties that bind me to your service and to your heart.
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

- type: selectableSet
  id: QuaranSet
  name: The Quaran
  description: Then which of your Lord’s favours will you ˹humans and jinn˺ both deny?
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
    state: icon
  content:
  - BibleQuaran

- type: selectableSet
  id: TanakhSet
  name: The Tanakh Scrolls
  description: As you teach, you learn.
  sprite:
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    state: scroll2
  content:
  - BibleTanakh

- type: selectableSet
  id: ClockworkSet
  name: The Clockwork Slab
  description: A link between you and the Celestial Derelict. It contains information, recites scripture, and is your most vital tool as a Servant.
  sprite:
    sprite: _ShitChap/Objects/clockwork_slab.rsi
    state: icon
  content:
  - BibleSlabClockwork

#Begin IMP selections
- type: selectableSet
  id: ScrollSet
  name: The Holy Scroll
  description: Between these dowels could hide heavenly revelations, devilish secrets, or a really long papercut.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: scroll
  content:
  - HolyTextHolyScroll

- type: selectableSet
  id: TabletSet
  name: The Holy Tablet
  description: Indecipherable to the layperson, only the chaplain knows whence its powers come.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: tablet
  content:
  - HolyTextHolyTablet

- type: selectableSet
  id: GreybibleSet
  name: The Greybible
  description: An NT breakthrough, this tome is compatible with all chaplains, regardless of their beliefs. It doesn't say much of anything.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: greybible
  content:
  - HolyTextGreybible

- type: selectableSet
  id: KojikiSet
  name: The Kojiki
  description: Through the understanding of yokai and their ways there will come peace with them.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: kojiki
  content:
  - HolyTextKojiki

- type: selectableSet
  id: TaoSet
  name: The Teachings of Tao
  description: In simplicity there is harmony. In effortlessness comes peace.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: tao
  content:
  - HolyTextTaoTeachings

- type: selectableSet
  id: DiscordSet
  name: The Principia Discordia
  description: The only constant of the universe is no constants exist.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: principia
  content:
  - HolyTextPrincipiaDiscordia

- type: selectableSet
  id: ArcaneSet
  name: The Grimoire
  description: The practices of wizardry do not differ much from the practices of divine worship.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: grimoire
  content:
  - HolyTextChaplainsGrimoire

- type: selectableSet
  id: UnitologySet
  name: The Tome of Unitology
  description: Through the continuous flow of spesos, you too can become immortal!!!
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: unitology
  content:
  - HolyTextUnitologyTome

- type: selectableSet
  id: ExtremeSet
  name: The Extreme Teen Bible
  description: In this tome contains the means of finally becoming totally tubular, dude.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: etb
  content:
  - HolyTextExtremeTeenBible

- type: selectableSet
  id: BibbleSet
  name: The Bibble
  description: If the author didn't mention making a pinky promise this was all true, this book would seem like total malarky!
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: bibble
  content:
  - HolyTextBibble

- type: selectableSet
  id: ThreesSet
  name: The Rule of Threes
  description: Through comedy, true enlightenment shall come.
  sprite:
    sprite: _Impstation/Objects/Specific/Chapel/holytexts.rsi
    state: clowntext
  content:
  - HolyTextClown



##END SET SELECTION

- type: entity
  name: bible
  description: New Interstellar Version 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -15
        Burn: -15
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 5 # Goobstation - bro wtf
        Blunt: 1
  #- type: Prayable - no, use the altar
  #  bibleUserOnly: true
  - type: AlternatePrayable # Goobstation
    requireBibleUser: false
  - type: Summonable
    specialItem: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Material
  #  - type: Tag
  #    tags:
  #    - Bible
  - type: StealTarget # Goobstation - fix
    stealGroup: Bible
  - type: EnchantingTool # Goobstation
  - type: StatusEffectOnCollideGhost # Goobstation
    whitelist:
      tags:
      - WeakToSalt
    statusEffect: Corporeal
    duration: 5

- type: entity
  parent: [Bible]
  name: necronomicon
  description: "There's a note: Klatuu, Verata, Nikto -- Don't forget it again!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  parent: BaseAction
  id: ActionBibleSummon
  name: Summon familiar
  description: Summon a familiar that will aid you and gain humanlike intelligence once inhabited by a soul.
  components:
