# SPDX-License-Identifier: MIT

name: Engine submodule version checker

on:
  pull_request:
    paths:
      - 'RobustToolbox'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_engine_version:
    name: Verify engine release pin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Verify RobustToolbox is pinned to v293.0.0
        shell: bash
        run: |
          expected=$(git ls-remote --exit-code https://github.com/space-wizards/RobustToolbox.git refs/tags/v293.0.0 | cut -f1)
          actual=$(git rev-parse HEAD:RobustToolbox)
          test -n "$expected"
          test "$actual" = "$expected"
