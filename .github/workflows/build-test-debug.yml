name: Build & Test Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - &swap
      name: Enlarge swap
      run: |
        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        sudo fallocate -l 12G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h

    - &checkout
      name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: git submodule update --init --recursive

    - &submodule_pull
      name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - &dotnet
      name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj

    - name: Build Project
      run: dotnet build Content.IntegrationTests/Content.IntegrationTests.csproj --configuration DebugOpt --no-restore /m -clp:ErrorsOnly

    - name: Save build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          bin/Content.*/*.json
          bin/Content.IntegrationTests/*.dll
          bin/Content.IntegrationTests/*.pdb
          bin/Content.IntegrationTests/runtimes/linux-x64/**
          bin/Content.Tests/*.dll
        retention-days: 1

  test-unit:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - *checkout
    - &submodule
      name: Setup Submodule
      run: git submodule update --init
    - *submodule_pull
    - *dotnet
    - &download_build
      name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: bin/

    - name: Link runtimes
      run: ln -s $(pwd)/bin/Content.IntegrationTests/runtimes bin/Content.Tests/

    - name: Run Content.Tests
      run: dotnet test bin/Content.Tests/Content.Tests.dll -- NUnit.ConsoleOut=0

  test-integration:
    name: test-integration (${{ matrix.shard.name }})
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: main
            filter: cat != MapTests && cat != GameRuleTests && cat != PrototypeSweepTests
          - name: prototype-sweep
            filter: cat == PrototypeSweepTests
          - name: maps-gamerules
            filter: cat == MapTests || cat == GameRuleTests

    env:
      DOTNET_gcServer: 1
      DOTNET_TieredPGO: 0

    steps:
    - *swap
    - *checkout
    - *submodule
    - *submodule_pull
    - *dotnet
    - *download_build

    - name: Run Content.IntegrationTests (${{ matrix.shard.name }})
      timeout-minutes: 40
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        # Each process has a 20-minute harness limit. Keep the expensive fixtures separate.
        # The final two filters partition all station cases, including any future additions.
        $stationNames = '(Name~Dev|Name~TestTeg|Name~Fland|Name~Meta|Name~Packed|Name~Cluster|Name~Omega|Name~Bagel|Name~CentComm|Name~Box|Name~Europa|Name~Atlas|Name~Core|Name~Marathon|Name~MeteorArena|Name~Saltern|Name~Reach|Name~Origin|Name~Train|Name~Oasis|Name~Cog)'
        $otherStations = $stationNames.Replace('Name~', 'Name!~').Replace('|', '&')
        $filters = @(
          'FullyQualifiedName!~PostMapInitTest&FullyQualifiedName!~Content.IntegrationTests.Tests.EntityTest&FullyQualifiedName!~Content.IntegrationTests.Tests.PrototypeTests&FullyQualifiedName!~Content.IntegrationTests.Tests.PrototypeSaveTest',
          'FullyQualifiedName~Content.IntegrationTests.Tests.PrototypeTests|FullyQualifiedName~Content.IntegrationTests.Tests.PrototypeSaveTest',
          'FullyQualifiedName~Content.IntegrationTests.Tests.EntityTest&FullyQualifiedName!~SpawnAndDeleteAllEntitiesOnDifferentMaps&FullyQualifiedName!~SpawnAndDirtyAllEntities',
          'FullyQualifiedName~Content.IntegrationTests.Tests.EntityTest.SpawnAndDeleteAllEntitiesOnDifferentMaps',
          'FullyQualifiedName~Content.IntegrationTests.Tests.EntityTest.SpawnAndDirtyAllEntities',
          'FullyQualifiedName~PostMapInitTest&FullyQualifiedName!~GameMapsLoadableTest',
          'FullyQualifiedName~PostMapInitTest.NonGameMapsLoadableTest',
          "FullyQualifiedName~PostMapInitTest.GameMapsLoadableTest&$stationNames",
          "FullyQualifiedName~PostMapInitTest.GameMapsLoadableTest&$otherStations"
        )
        $failed = $false
        for ($i = 0; $i -lt $filters.Count; $i++) {
          Write-Output "Running integration partition $($i + 1)/$($filters.Count)"
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter $filters[$i] --logger "trx;LogFileName=integration-$i.trx" --results-directory TestResults -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
          if ($LASTEXITCODE -ne 0) { $failed = $true }
        }
        if ($failed) { exit 1 }
  ci-success:
    name: Build & Test Debug
    needs: [build, test-unit, test-integration]
    runs-on: ubuntu-latest
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: CI succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ||
                "${{ needs.test-unit.result }}" != "success" ||
                "${{ needs.test-integration.result }}" != "success" ]]; then
            echo "Not all tests succeeded!"
            exit 1
          fi
          exit 0
