version = 1
SPDX-PackageName = "Jamboree Station"
SPDX-PackageSupplier = "Organization: Jamboree Station"
SPDX-PackageDownloadLocation = "https://github.com/JamboreeStation/Jamboree-Station"

# Do not infer licensing from a file's extension or its containing directory.
# Audio and texture declarations are transcribed in their nested REUSE.toml
# files. Missing/contradictory evidence is recorded in LICENSE-AUDIT.md and the
# accompanying inventories, not replaced with a default license or owner.

[[annotations]]
path = ["LICENSE-AUDIT-SOURCE.json", "LICENSE-AUDIT-TEXTURES.json", "LICENSE-AUDIT-RESOURCES.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jamboree Station Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
SPDX-FileComment = "Licenses the audit report compilation, not the works or license grants described by it."
